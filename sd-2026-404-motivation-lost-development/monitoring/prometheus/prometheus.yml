# Prometheus configuration — EOP v0.2 (US-205 scaffold)
# AC4: default scrape interval 15s (global + per-job).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eop-server
    metrics_path: /metrics
    static_configs:
      - targets: ["eop-server:9464"]
        labels:
          service: eop-server

  # Blackbox TCP probe: 1 = connection accepted (complement to /metrics).
  - job_name: eop-tcp-probe
    metrics_path: /probe
    params:
      module: [tcp_connect]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    static_configs:
      - targets:
          - eop-server:9026
