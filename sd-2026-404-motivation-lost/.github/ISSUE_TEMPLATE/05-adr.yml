name: "ADR — Architecture Decision"
description: "Document an architectural decision. SW Agreement Sec 2.2: No undocumented architectural decisions."
title: "[ADR] ADR-<NUMBER> — <Decision Title>"
labels: ["adr", "design"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Architecture Decision Record
        Document the decision following the ADR format. All ADRs are binding once accepted.

  - type: input
    id: adr_number
    attributes:
      label: ADR Number
      placeholder: "015"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Proposed
        - Accepted
        - Superseded
    validations:
      required: true

  - type: dropdown
    id: lab
    attributes:
      label: Lab / Release
      options:
        - v0.1
        - v0.2
        - v0.3
        - v1.0
    validations:
      required: true

  - type: dropdown
    id: deciders
    attributes:
      label: Deciders
      options:
        - Squad
        - All squads + Instructor
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: "What is the technical problem or decision point? What forces or constraints are at play? Why does this decision need to be made now?"
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: "What is the decision? Be specific and unambiguous. Include code examples if relevant."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: |
        | Alternative | Reason Rejected |
        |-------------|----------------|
        | Option A | Why not |
        | Option B | Why not |
    validations:
      required: true

  - type: textarea
    id: consequences_positive
    attributes:
      label: "Consequences — Positive"
      placeholder: |
        - Benefit 1
        - Benefit 2
    validations:
      required: true

  - type: textarea
    id: consequences_negative
    attributes:
      label: "Consequences — Negative"
      placeholder: |
        - Trade-off 1
        - Trade-off 2
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints Introduced
      placeholder: |
        - New constraint on the codebase
    validations:
      required: false

  - type: checkboxes
    id: artifacts
    attributes:
      label: Artifacts
      description: "After approval, ensure the following are completed."
      options:
        - label: "ADR document committed to /docs/adr/"
          required: true
        - label: "Linked from project README"
        - label: "Referenced in relevant Epic/Story issues"
