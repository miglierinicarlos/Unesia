name: "User Story"
description: "A user story with acceptance criteria. Maps to PRD user stories (US-XXX). Contains sub-tasks."
title: "[US-<NUMBER>] <Story Title>"
labels: ["user-story", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## User Story
        Fill in the fields below. Acceptance criteria must be copied exactly from the PRD.

  - type: input
    id: story_id
    attributes:
      label: Story ID
      description: "Story identifier from the PRD (e.g., US-101)"
      placeholder: "US-101"
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic
      description: "Parent epic issue number and ID (e.g., #5 E1)"
      placeholder: "#5 E1"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: "Target milestone"
      options:
        - M1
        - M2
        - M3
        - M4
    validations:
      required: true

  - type: dropdown
    id: release
    attributes:
      label: Release
      description: "Target release version"
      options:
        - v0.1
        - v0.2
        - v0.3
        - v1.0
    validations:
      required: true

  - type: input
    id: prd_reference
    attributes:
      label: PRD Reference
      description: "Section and story reference in the PRD"
      placeholder: "Section 3, Epic E1, US-101"
    validations:
      required: true

  - type: dropdown
    id: persona
    attributes:
      label: Persona
      description: "Primary persona for this story"
      options:
        - Vault Operator
        - Network Analyst
        - Integration Engineer
        - Edge Device
    validations:
      required: true

  - type: textarea
    id: story_statement
    attributes:
      label: User Story Statement
      description: "As a [persona], I want to [action], so that [benefit]."
      placeholder: |
        **As a** Vault Operator,
        **I want to** register a bunker node,
        **So that** the network can track its status.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "Copy EXACTLY from the PRD. Each AC is a checkbox. These are contractual."
      placeholder: |
        - [ ] **AC1.** Criterion from PRD
        - [ ] **AC2.** Criterion from PRD
        - [ ] **AC3.** Criterion from PRD
    validations:
      required: true

  - type: textarea
    id: subtasks
    attributes:
      label: Sub-Tasks
      description: "Break the story into implementable units. Each becomes a sub-issue using the Sub-Task template."
      placeholder: |
        - [ ] #issue Sub-task description
        - [ ] #issue Sub-task description
    validations:
      required: false

  - type: textarea
    id: technical_approach
    attributes:
      label: Technical Approach
      description: "Brief technical description of HOW this story will be implemented. Reference ADRs, interfaces, and design patterns."
    validations:
      required: false

  - type: textarea
    id: files_affected
    attributes:
      label: Files Affected
      description: "List the main files/modules that will be created or modified"
      placeholder: |
        - `src/...`
        - `include/...`
        - `tests/...`
    validations:
      required: false

  - type: textarea
    id: adrs_referenced
    attributes:
      label: ADRs Referenced
      placeholder: |
        - ADR-XXX: Title
    validations:
      required: false

  - type: checkboxes
    id: nfrs
    attributes:
      label: NFRs Applicable
      description: "Which NFRs are enforced from this story's release?"
      options:
        - label: "P99 latency within threshold"
        - label: "Zero memory leaks (ASan)"
        - label: "Zero data races (TSan)"
        - label: "RAII for all resources"
        - label: "Graceful shutdown on SIGTERM"
        - label: "Structured JSON logs with trace_id"
        - label: "OTel span emitted"
        - label: "Docker image ≤ 50 MB"
        - label: "K8s manifests pass validation"

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "What blocks this story or what does this story block?"
      placeholder: |
        - **Blocked by:** #issue
        - **Blocks:** #issue
    validations:
      required: false

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done (SW Agreement Sec 6.6)
      options:
        - label: "All acceptance criteria met"
          required: true
        - label: "CI/CD pipeline passes"
          required: true
        - label: "At least one peer review approved"
          required: true
        - label: "Documentation updated"
          required: true
        - label: "No memory leaks or data races introduced (sanitizers green)"
          required: true
        - label: "If architectural decision made → ADR documented in /docs/adr/"
