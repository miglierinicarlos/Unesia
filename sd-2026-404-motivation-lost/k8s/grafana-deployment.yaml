apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.3
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-dashboards-json
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-dashboards-yaml
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-datasources-yaml
          mountPath: /etc/grafana/provisioning/datasources
      volumes:
      - name: grafana-dashboards-json
        configMap:
          name: grafana-dashboards-json
      - name: grafana-dashboards-yaml
        configMap:
          name: grafana-dashboards-yaml
      - name: grafana-datasources-yaml
        configMap:
          name: grafana-datasources-yaml
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 32001
