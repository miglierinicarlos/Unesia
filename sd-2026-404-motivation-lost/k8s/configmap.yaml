# k8s/configmap.yaml
# AC6 US-108: toda la config en ConfigMap, sin valores hardcodeados en la imagen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eop-server-config
  namespace: default
data:
  EOP_PORT: "9026"
  EOP_IDLE_TIMEOUT: "3600"
  EOP_THREAD_POOL_SIZE: "16"
  EOP_MAX_CLIENTS: "10000"
  EOP_HEARTBEAT_INTERVAL: "5"
  OTEL_SERVICE_NAME: "eop-server"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  # v0.2 HPC engine config
  HPC_NODE_ID: "hpc-engine-0"
  OMP_NUM_THREADS: "2"
  EOP_HPC_TIMEOUT: "30"
  EOP_SERVER_HOST: "eop-server"
